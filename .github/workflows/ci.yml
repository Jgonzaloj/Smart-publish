name: Smart Publish CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: smart/package-lock.json

      - name: Install dependencies
        working-directory: ./smart
        run: npm ci

      - name: Build frontend bundle
        working-directory: ./smart
        run: npm run build

  backend-build-and-test:
    name: Backend Typecheck & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend (tsc)
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32bytes_long
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          DB_HOST: localhost
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: smart_publish_test
        run: npm test -- --passWithNoTests
