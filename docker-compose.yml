version: '3.8'

services:
  # Base de Datos PostgreSQL con soporte para Row Level Security (RLS)
  postgres:
    image: postgres:16-alpine
    container_name: crediya-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crediya_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperClaveSegura2026!}
      POSTGRES_DB: ${POSTGRES_DB:-crediya_db}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/rls_policies.sql:/docker-entrypoint-initdb.d/99-rls_policies.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crediya_app} -d ${POSTGRES_DB:-crediya_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Backend API + PWA Frontend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crediya-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-crediya_app}:${POSTGRES_PASSWORD:-SuperClaveSegura2026!}@postgres:5432/${POSTGRES_DB:-crediya_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-genera-una-clave-larga-y-secreta-para-produccion-2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local
